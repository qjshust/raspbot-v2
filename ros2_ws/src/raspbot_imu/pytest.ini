[pytest]
# DSH 的 Windows 沙箱下，pytest 的缓存目录可能拿到当前用户无删除权限的 ACL，
# 留下无法清理的 pytest-cache-files-* 目录；这里直接关闭缓存（CI 与本地无影响）。
addopts = -p no:cacheprovider
testpaths = test
# 包已重写为 C++（ament_cmake）；test/*.py 保留为回归参照，其导入的 Python
# 源码归档在 workspace 根下的 legacy_python/，此处把归档目录加进 sys.path，
# 保证从任意工作目录运行 pytest 仍可 import raspbot_imu。
pythonpath = ../../../legacy_python
