# RASPBOT-V2 · WP-F · AMCL 参数（nav2_amcl 1.5.2）
#
# 来源：/opt/ros/lyrical/share/nav2_bringup/params/nav2_params.yaml 的 amcl 段
#      （该文件顶层键名是 amcl，不是 nav2_amcl——已读文件第 1 行确认）。
# 照抄 nav2 1.5.2 默认 amcl 段并做以下裁剪/调整：
#   1) base_frame_id: base_footprint -> base_link   （本项目 TF 契约用 base_link）
#   2) scan_topic: scan                              （节点在根命名空间，解析为 /scan，由 C 提供 10 Hz）
#   3) min_particles 500 -> 200 / max_particles 2000 -> 1000
#      （低速麦轮车 ≤0.3 m/s、雷达仅 10 Hz，粒子数减半可显著降低 Pi5 CPU 占用，定位精度不受影响）
#   4) update_min_d 0.25 -> 0.2 / update_min_a 0.2
#      （低速下让运动阈值更容易触发滤波更新；nav2_amcl 1.5.2 没有独立的 update_rate 参数，
#        滤波随每帧 /scan 触发，但只有累计移动超过这两个阈值才真正更新；
#        0.2 m @ ≤0.3 m/s 约合 1~2 Hz 的有效更新节奏）
#   5) resample_interval: 1（默认）
#      （每次有效滤波更新都重采样一次，即约 1 Hz 的重采样频率；AMCL 无独立 resample_rate 参数）
#   6) robot_model_type: DifferentialMotionModel -> nav2_amcl::OmniMotionModel
#      （麦轮全向底盘：差速模型无法表达横移（vy 恒 0），Omni 模型使用 /odom 的 vx/vy/ω；
#        E 的 EKF 若输出全 3D 状态则横移可正确积分，即使 vy=0 也退化为差速行为，无副作用）
#   7) 其余参数保持 nav2 1.5.2 默认（激光模型 likelihood_field、max_beams 60、
#      transform_tolerance 1.0 s 对 10 Hz 雷达足够等）
#
# 用法：由 launch/localization.launch.py 通过 params_file:= 传给 nav2_bringup 的
#      localization_launch.py（其 RewrittenYaml root_key='' 保持顶层键名不变）。
# 注意：nav2_amcl/nav2_map_server 1.5.2 不支持 autostart 参数（写进本文件无效，
#      Pi 实测节点仍停在 unconfigured），lifecycle 激活由 localization.launch.py 里
#      追加的 nav2_lifecycle_manager 完成。
amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 1000
    min_particles: 200
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    random_seed: -1
    resample_interval: 1
    robot_model_type: "nav2_amcl::OmniMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    introspection_mode: "disabled"
    update_min_a: 0.2
    update_min_d: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

# map_server 段：照抄 nav2_params.yaml 的 map_server 段（yaml_filename 由 launch 参数 map:= 注入，
# 不写死在文件里，以便同一份参数服务多张地图）。
map_server:
  ros__parameters:
    introspection_mode: "disabled"
