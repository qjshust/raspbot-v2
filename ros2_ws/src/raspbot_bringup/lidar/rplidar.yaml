# rplidar_node 参数（rplidar_ros 2.1.4，源码构建于 Pi ~/ros2_ws；裁决 J-02）
#
# 参数名验证（Pi 只读取证）：
#   - 二进制 strings ~/ros2_ws/install/rplidar_ros/lib/rplidar_ros/rplidar_node 含
#     channel_type / serial_port / serial_baudrate / frame_id / inverted /
#     angle_compensate / scan_mode / flip_x_axis / scan_frequency / auto_standby
#     （以及 tcp_ip/tcp_port/udp_ip/udp_port，非本车使用）
#   - 官方示例 ~/ros2_ws/install/rplidar_ros/share/rplidar_ros/launch/rplidar_c1_launch.py
#     使用同名参数（serial_baudrate 默认 460800）
# 实测基线（docs/硬件全面测试报告_2026-11-19.md §5.1、tools/slam/smoke_slam.sh）：
#   DenseBoost / 460800 8N1 / angle_compensate=true → /scan 10.0 Hz、
#   720 点/圈（有效 661，91.8%）、0.18~2.76 m、frame_id=laser、health=0
rplidar_node:
  ros__parameters:
    # ---- 通道 ----
    channel_type: serial               # serial|udp|tcp；本车 USB-CP2102N 转接，固定 serial
    serial_port: /dev/raspbot_lidar    # udev 固定命名（FR-C-02），禁止写 /dev/ttyUSB*
    serial_baudrate: 460800            # C1 出厂 460800 8N1（硬件报告 §5.1）

    # ---- 帧 ----
    frame_id: laser                    # 裁决 J-01：契约 TF 树为 base_link->laser；
                                       #   /scan.frame_id 必须为 laser，绝不允许 laser_link
    inverted: false                    # 电机正转，实测无需翻转
    flip_x_axis: false                 # ROS +x 为车前方，无需镜像
    angle_compensate: true             # C1 固件角度补偿（实测基线必需项）

    # ---- 扫描模式 ----
    scan_mode: DenseBoost              # 5 kHz 采样 / 10.0 Hz / max 15 m（硬件报告基线）
    # 注意：
    #   - scan_frequency（S2E 等型号的参数）对 C1 串口模式无效，勿设；
    #     10 Hz 由 scan_mode 决定（DenseBoost 实测 9.97~10.01 Hz）。
    #   - auto_standby（默认 true，电机低速待机）保持默认。

