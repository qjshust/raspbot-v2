# FR-C-04 量程模板（占位做法，P2）：
#   本文件 = 室内模板。户外模板按以下步骤加，不改 launch、不改代码：
#   1. 复制本文件为 lidar_outdoor.yaml 并调整（户外模板建议值）：
#        - scan_mode: DenseBoost
#          （保持；C1 可选 Boost（采样密度低）/DenseBoost，日光下不建议降密度）
#        - 量程收缩建议放在建图参数侧（WP-F 的 slam_params.yaml，日光下 C1 有效
#          量程 6~8 m，见测试方案 §4.2 雷达行）：
#              min_laser_range: 0.2 -> 0.35   # 抑制近距离日光/地面噪点
#              max_laser_range: 12.0 -> 8.0
#        - 若后续在本包加距离滤波，可在 rear_filter.yaml 链上追加
#          laser_filters/LaserScanRangeFilter 作为 filter2（参数键格式见该文件注释）。
#   2. 启动切换（launch 层参数覆盖，验收口径 SW-G09/SYS-M06）：
#        ros2 launch raspbot_bringup lidar.launch.py \
#            lidar_params_file:=<share>/raspbot_bringup/lidar/lidar_outdoor.yaml
# ---------------------------------------------------------------------------
